<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAMILY PLAN - 대시보드</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/chart.min.js"></script>
</head>
<body>
<div id="header"></div>
<div class="container">
  <div class="alert-area" id="alertArea">
    <div class="alert-badge" id="todayBadge">
      <span class="count" id="todayCount">0</span> 오늘의 일정
    </div>
    <div class="alert-badge" id="weekBadge">
      <span class="count" id="weekCount">0</span> 이번주 일정
    </div>
  </div>

  <div class="inline-add-bar" id="inlineAddBar">
    <input type="text" id="inlineTitle" placeholder="일정명" maxlength="60">
    <div id="inlineTargetAll" class="target-btn-group"></div>
    <button class="btn btn-primary btn-sm" id="inlineAddBtn">+ 추가</button>
    <button class="btn btn-outline btn-sm" id="toggleDetailBtn" title="상세 옵션">&#9660;</button>
  </div>
  <div class="inline-add-detail" id="inlineDetail" style="display:none">
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label style="font-size:var(--font-size-xs);margin-bottom:2px">대상자</label>
        <div id="inlineTarget" class="target-btn-group"></div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label style="font-size:var(--font-size-xs);margin-bottom:2px">FROM</label>
        <div style="display:flex;gap:4px">
          <input type="date" id="inlineDateFrom" style="flex:2">
          <input type="time" id="inlineTimeFrom" style="flex:1">
        </div>
      </div>
      <div class="form-group">
        <label style="font-size:var(--font-size-xs);margin-bottom:2px">TO</label>
        <div style="display:flex;gap:4px">
          <input type="date" id="inlineDateTo" style="flex:2">
          <input type="time" id="inlineTimeTo" style="flex:1">
        </div>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <input type="text" id="inlineRequester" placeholder="요청자">
      </div>
    </div>
    <div class="slider-group">
      <input type="range" id="inlineProgress" min="0" max="100" value="0">
      <span class="slider-val" id="inlineProgressVal">0%</span>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="inlineRecurring" style="width:auto">
        <option value="">반복 없음</option>
        <option value="daily">매일</option>
        <option value="weekly">매주</option>
        <option value="monthly">매월</option>
        <option value="yearly">매년</option>
      </select>
      <input type="date" id="inlineRecurEnd" placeholder="종료일" style="flex:1;display:none">
    </div>
  </div>

  <div class="schedule-list" id="scheduleList"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <p>등록된 일정이 없습니다.</p>
    <p style="font-size:var(--font-size-sm)">위 입력창에 일정을 추가해보세요.</p>
  </div>

  <div class="progress-section" id="progressSection"></div>

  <div class="view-tabs" id="viewTabs">
    <button data-view="day" class="active">일</button>
    <button data-view="week">주</button>
    <button data-view="month">월</button>
    <button data-view="year">년</button>
  </div>

  <div class="calendar-nav" id="calendarNav">
    <button id="prevBtn">&lt;</button>
    <span class="current-label" id="currentLabel"></span>
    <button id="nextBtn">&gt;</button>
  </div>

  <div id="calendarContainer"></div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="일정 검색 (제목, 요청자, 소요시간)">
    <select id="filterStatus">
      <option value="">전체 상태</option>
      <option value="completed">완료</option>
      <option value="pending" selected>미완료</option>
    </select>
    <input type="date" id="filterDateFrom" title="시작일">
    <input type="date" id="filterDateTo" title="종료일">
    <div id="filterTarget" class="target-btn-group" style="width:100%"></div>
  </div>

  <div class="family-panel" id="familyPanel" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3 id="familyPanelTitle">가족 구성원 관리</h3>
      <button class="btn btn-outline btn-sm" id="settingsBtn" style="display:none">그룹 설정</button>
    </div>
    <div class="member-list" id="memberList"></div>
    <div style="margin-top:8px;font-size:var(--font-size-xs);color:var(--color-text-secondary)">
      참여 키: <strong id="joinKeyDisplay">----</strong> (가족원 초대 시 공유)
    </div>
    <div style="margin-top:8px">
      <button class="btn btn-outline btn-sm" id="toggleFamilyBtn">접기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="scheduleModal" style="display:none">
  <div class="modal">
    <h3 id="modalTitle">일정 추가</h3>
    <form id="scheduleForm">
      <input type="hidden" id="editScheduleId">
      <div class="form-row">
        <div class="form-group">
          <label for="schedTitle">일정명</label>
          <input type="text" id="schedTitle" placeholder="일정명을 입력하세요" required>
        </div>
      </div>
      <div class="form-group">
        <label>대상자</label>
        <div id="schedTarget" class="target-btn-group"></div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="schedRequester">요청자</label>
          <input type="text" id="schedRequester" placeholder="요청자 이름">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>FROM</label>
          <div style="display:flex;gap:4px">
            <input type="date" id="schedDateFrom" required style="flex:2">
            <input type="time" id="schedTimeFrom" style="flex:1">
          </div>
        </div>
        <div class="form-group">
          <label>TO</label>
          <div style="display:flex;gap:4px">
            <input type="date" id="schedDateTo" style="flex:2">
            <input type="time" id="schedTimeTo" style="flex:1">
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>진행률</label>
        <div class="slider-group">
          <input type="range" id="schedProgress" min="0" max="100" value="0">
          <span class="slider-val" id="schedProgressVal">0%</span>
        </div>
      </div>
      <div class="form-group">
        <label>반복 일정</label>
        <select id="schedRecurring">
          <option value="">없음</option>
          <option value="daily">매일</option>
          <option value="weekly">매주</option>
          <option value="monthly">매월</option>
          <option value="yearly">매년</option>
        </select>
      </div>
      <div class="form-group" id="recurEndGroup" style="display:none">
        <label for="schedRecurEnd">반복 종료일</label>
        <input type="date" id="schedRecurEnd">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modalCancelBtn">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="settingsModal" style="display:none">
  <div class="modal">
    <h3>그룹 설정</h3>
    <form id="settingsForm">
      <div class="form-group">
        <label for="settingsGroupName">그룹명</label>
        <input type="text" id="settingsGroupName" placeholder="가족 그룹 이름 (예: 김씨 가족)" maxlength="30">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="settingsCancelBtn">취소</button>
        <button type="submit" class="btn btn-primary">저장</button>
      </div>
    </form>
  </div>
</div>

<script src="js/supabase.min.js"></script>
<script src="js/bcryptjs.min.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
