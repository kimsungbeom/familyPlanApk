<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAMILY PLAN</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<style>
  .splash { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:var(--color-surface-raised); }
  .splash h1 { font-size:36px; font-weight:800; color:var(--color-accent); margin-bottom:6px; }
  .splash p { font-size:var(--font-size-lg); color:var(--color-text-secondary); }
  .splash .dot { display:inline-block; animation:pulse 1.4s infinite; }
  .splash .dot:nth-child(2) { animation-delay:.2s; }
  .splash .dot:nth-child(3) { animation-delay:.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0} 40%{opacity:1} }
</style>
</head>
<body>
<div class="splash">
  <h1>FAMILY PLAN</h1>
  <p>일정 로딩 중<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
</div>
<script src="js/supabase.min.js"></script>
<script src="js/bcryptjs.min.js"></script>
<script src="js/app.js"></script>
<script>
  (async function() {
    var s = await getSession();
    if (s) window.location.href = 'dashboard.html';
    else window.location.href = 'login.html';
  })();
</script>
</body>
</html>
