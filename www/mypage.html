<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAMILY PLAN - 마이페이지</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>
<div class="container">
  <div class="mypage-container">
    <h2>마이페이지</h2>
    <div id="successMsg" class="success-msg"></div>
    <div id="errorMsg" class="error-msg"></div>

    <h3 style="font-size:var(--font-size-xl); font-weight:700; margin-bottom:12px;">비밀번호 변경</h3>
    <form id="changePassForm">
      <div class="form-group">
        <label for="currentPass">현재 비밀번호</label>
        <input type="password" id="currentPass" placeholder="현재 비밀번호" required>
      </div>
      <div class="form-group">
        <label for="newPass">새 비밀번호</label>
        <input type="password" id="newPass" placeholder="새 비밀번호" required>
      </div>
      <button type="submit" class="btn btn-primary">비밀번호 변경</button>
    </form>

    <h3 style="font-size:var(--font-size-xl); font-weight:700; margin:20px 0 12px;">커스텀 테마</h3>
    <div class="theme-section">
      <div class="theme-presets">
        <span class="theme-label">프리셋</span>
        <button class="theme-preset" data-accent="#03c75a" data-bg="#f6f6f7" style="background:#03c75a" title="기본"></button>
        <button class="theme-preset" data-accent="#3b82f6" data-bg="#f0f5ff" style="background:#3b82f6" title="블루"></button>
        <button class="theme-preset" data-accent="#6366f1" data-bg="#1e1e2e" style="background:#6366f1" title="다크"></button>
        <button class="theme-preset" data-accent="#f59e0b" data-bg="#fffbeb" style="background:#f59e0b" title="웜"></button>
      </div>
      <div class="theme-custom">
        <div class="theme-row">
          <label>강조색</label>
          <input type="color" id="themeAccent" value="#03c75a">
        </div>
        <div class="theme-row">
          <label>배경색</label>
          <input type="color" id="themeBgColor" value="#f6f6f7">
        </div>
        <div class="theme-row" style="flex-direction:column;align-items:stretch">
          <div style="display:flex;justify-content:space-between">
            <label>폰트 크기</label>
            <span id="fontSizeVal" class="theme-label">12px</span>
          </div>
          <input type="range" id="themeFontSize" min="12" max="20" value="12" style="width:100%;margin-top:4px">
        </div>
        <button id="saveThemeBtn" class="btn btn-primary btn-sm">테마 저장</button>
      </div>
    </div>

    <div class="danger-zone">
      <h3>회원 탈퇴</h3>
      <p style="font-size:var(--font-size-sm); color:var(--color-text-secondary); margin-bottom:12px;">
        탈퇴 시 모든 데이터가 삭제됩니다. 그룹 생성자는 탈퇴할 수 없습니다.
      </p>
      <button id="deleteAccountBtn" class="btn btn-danger">회원 탈퇴</button>
    </div>
  </div>
</div>
<script src="js/supabase.min.js"></script>
<script src="js/bcryptjs.min.js"></script>
<script src="js/app.js"></script>
<script src="js/mypage.js"></script>
</body>
</html>
